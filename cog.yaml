build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
  python_packages:
    - "numpy==1.26.4"
    - "torch==2.5.1"
    - "torchaudio==2.5.1"
    - "einops"
    - "safetensors"
    - "soundfile"
    - "scipy"
    - "transformers"
    - "huggingface-hub"
  run:
    - command: >-
        HF_TOKEN=$(cat /run/secrets/hf_token) python -c "
        from huggingface_hub import snapshot_download;
        snapshot_download('stabilityai/stable-audio-3-medium')
        "
      mounts:
        - type: secret
          id: hf_token
          target: /run/secrets/hf_token
predict: "predict.py:Predictor"
