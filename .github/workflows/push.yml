name: Push to Replicate
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Enter the model name, like "your-username/stable-audio-3-medium"'
        required: true

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}
          
      - name: Push to Replicate
        run: cog push r8.im/${{ inputs.model_name }}
